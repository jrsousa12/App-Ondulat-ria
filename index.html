<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="Ondulatória e Som — 9º ano. App de estudo, atividades e simulações.">

      <path d="M0,20 Q50,0 100,20 T200,20 T300,20 T400,20" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </header>

  <main id="conteudo" class="conteudo" role="main" tabindex="-1"></main>

  <nav class="nav-inferior" aria-label="Navegação principal">
    <a href="#inicio"   class="nav-item" data-rota="inicio">Início</a>
    <a href="#trilhas"  class="nav-item" data-rota="trilhas">Trilhas</a>
    <a href="#praticar" class="nav-item" data-rota="praticar">Praticar</a>
