<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <noscript>

      <h1>Ondulatória</h1>

  <header class="topo">

        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <span id="xp-total" class="xp" role="status" aria-live="polite">0 XP</span>
    </div>
    <svg class="onda-header" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,20 Q50,0 100,20 T200,20 T300,20 T400,20" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </header>

  <main id="conteudo" class="conteudo" role="main" tabindex="-1"></main>

    <a href="#trilhas" class="nav-item" data-rota="trilhas"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6"/></svg><span>Trilhas</span></a>
    <a href="#praticar" class="nav-item" data-rota="praticar"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M7 19h14V9"/></svg><span>Praticar</span></a>
    <a href="#lab" class="nav-item" data-rota="lab"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.6 1.6 0 0 0 5.9 21h12.2a1.6 1.6 0 0 0 1.4-2.5L14 9V3"/><path d="M7.5 15h9"/></svg><span>Lab</span></a>
    <a href="#perfil" class="nav-item" data-rota="perfil"><svg class="nav-icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></a>
